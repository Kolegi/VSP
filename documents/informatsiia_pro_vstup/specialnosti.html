<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Перспективи спеціальностей — Новоушицький фаховий коледж</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;700;900&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f0a;
  --panel: rgba(255,255,255,0.035);
  --border: rgba(255,255,255,0.08);
  --white: #f5f4ef;
  --dim: rgba(245,244,239,0.5);
  --green: #3a7d44;
  --green2: #5cad6a;
  --gold: #d4a017;
  --gold2: #f5c842;
  --blue: #2a7ab5;
  --blue2: #4da3e8;
  --teal: #1e8c7a;
  --teal2: #35c4ac;
  --rust: #b54c2a;
  --rust2: #e8773d;
  --violet: #5a3ab5;
  --violet2: #8e6de8;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Raleway', sans-serif;
  background: var(--bg);
  color: var(--white);
  min-height: 100vh;
  overflow: hidden;
  cursor: none;
}

/* ── cursor ── */
#cur {
  width:14px; height:14px;
  border-radius:50%;
  background: var(--gold2);
  position:fixed; z-index:9999;
  pointer-events:none;
  transform:translate(-50%,-50%);
  mix-blend-mode: difference;
  transition: transform .1s;
}
#cur.big { transform:translate(-50%,-50%) scale(3); }

/* ── BG noise & gradient ── */
body::before {
  content:'';
  position:fixed; inset:0;
  background:
    radial-gradient(ellipse 70% 50% at 15% 30%, rgba(58,125,68,.18) 0%, transparent 55%),
    radial-gradient(ellipse 50% 60% at 85% 70%, rgba(212,160,23,.12) 0%, transparent 55%);
  pointer-events:none; z-index:0;
}

/* ── LAYOUT ── */
.shell {
  position:relative; z-index:1;
  display:grid;
  grid-template-columns: 300px 1fr;
  grid-template-rows: auto 1fr;
  height:100vh;
  gap:0;
}

/* ── TOP BAR ── */
.topbar {
  grid-column: 1/-1;
  display:flex; align-items:center; justify-content:space-between;
  padding: 22px 36px 18px;
  border-bottom: 1px solid var(--border);
  background: rgba(13,15,10,.7);
  backdrop-filter: blur(20px);
}
.logo-area { display:flex; align-items:center; gap:14px; }
.logo-dot {
  width:36px; height:36px;
  background: linear-gradient(135deg, var(--green), var(--gold));
  border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-size:18px;
}
.logo-text { font-family:'Unbounded',sans-serif; font-size:11px; line-height:1.5; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
.logo-text strong { display:block; color:var(--white); font-size:13px; font-weight:700; }
.topbar-tag {
  font-size:11px; letter-spacing:.15em; text-transform:uppercase;
  color:var(--gold2); border:1px solid rgba(245,200,66,.25);
  padding:5px 14px; border-radius:100px;
  background:rgba(245,200,66,.06);
  animation: pulseTag 3s ease-in-out infinite;
}
@keyframes pulseTag {
  0%,100%{ box-shadow:0 0 0 0 rgba(245,200,66,.3); }
  50%{ box-shadow:0 0 0 6px rgba(245,200,66,0); }
}

/* ── SIDEBAR ── */
.sidebar {
  border-right: 1px solid var(--border);
  overflow-y:auto;
  padding: 20px 0;
  background: rgba(255,255,255,.01);
  scrollbar-width:none;
}
.sidebar::-webkit-scrollbar { display:none; }

.sidebar-title {
  font-family:'Unbounded',sans-serif;
  font-size:9px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--dim); padding:0 24px 12px;
}

.spec-tab {
  display:flex; align-items:center; gap:14px;
  padding:14px 24px;
  cursor:none;
  border-left:3px solid transparent;
  transition:all .25s ease;
  position:relative;
}
.spec-tab:hover { background:rgba(255,255,255,.04); }
.spec-tab.active {
  background:rgba(255,255,255,.06);
  border-left-color:var(--tab-color, var(--green2));
}
.spec-tab.active .tab-name { color:var(--white); }
.tab-icon {
  width:38px; height:38px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; flex-shrink:0;
  background: rgba(255,255,255,.06);
  transition: transform .2s, background .2s;
}
.spec-tab.active .tab-icon,
.spec-tab:hover .tab-icon {
  background: rgba(255,255,255,0.12);
  transform:scale(1.08);
}
.tab-info { flex:1; min-width:0; }
.tab-code { font-size:10px; color:var(--dim); letter-spacing:.06em; }
.tab-name { font-size:13px; font-weight:600; color:rgba(245,244,239,.75); line-height:1.3; margin-top:2px; transition:color .2s; }

/* ── MAIN CONTENT ── */
.main {
  overflow:hidden;
  position:relative;
}

.spec-panel {
  display:none;
  height:100%;
  flex-direction:column;
  padding:36px 44px;
  overflow-y:auto;
  scrollbar-width:none;
  animation:panelIn .4s ease;
}
.spec-panel::-webkit-scrollbar{display:none;}
.spec-panel.active { display:flex; }

@keyframes panelIn {
  from{ opacity:0; transform:translateX(18px); }
  to  { opacity:1; transform:translateX(0); }
}

/* Panel header */
.panel-head {
  display:flex; align-items:flex-start; justify-content:space-between;
  margin-bottom:32px; gap:20px;
}
.panel-head-left {}
.panel-emoji { font-size:56px; line-height:1; margin-bottom:12px; animation:float 4s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.panel-code {
  font-size:11px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--dim); margin-bottom:6px;
}
.panel-title {
  font-family:'Unbounded',sans-serif;
  font-size:clamp(20px,2.8vw,34px);
  font-weight:900; line-height:1.1;
  background:linear-gradient(135deg, var(--white) 40%, rgba(245,244,239,.55));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.panel-salary {
  display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0;
}
.salary-label { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
.salary-num {
  font-family:'Unbounded',sans-serif; font-size:28px; font-weight:700;
  color:var(--gold2);
}
.salary-sub { font-size:11px; color:var(--dim); }

/* Description */
.panel-desc {
  font-size:15px; line-height:1.75; color:rgba(245,244,239,.72);
  margin-bottom:32px; max-width:640px;
  border-left:3px solid var(--accent-color, var(--green2));
  padding-left:18px;
}

/* Stats row */
.stats-row {
  display:grid; grid-template-columns:repeat(3,1fr); gap:14px;
  margin-bottom:32px;
}
.stat-card {
  background:var(--panel); border:1px solid var(--border);
  border-radius:18px; padding:20px 22px;
  transition:transform .2s, background .2s;
}
.stat-card:hover { transform:translateY(-3px); background:rgba(255,255,255,.06); }
.stat-val {
  font-family:'Unbounded',sans-serif; font-size:28px; font-weight:700;
  background:linear-gradient(135deg, var(--accent-color, var(--green2)), var(--white));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  margin-bottom:4px;
}
.stat-label { font-size:12px; color:var(--dim); line-height:1.4; }

/* Two-col layout */
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:32px; }

.info-block {
  background:var(--panel); border:1px solid var(--border);
  border-radius:20px; padding:24px;
}
.info-block-title {
  font-family:'Unbounded',sans-serif; font-size:10px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--dim); margin-bottom:16px;
  display:flex; align-items:center; gap:8px;
}
.info-block-title::before {
  content:''; display:block; width:16px; height:2px;
  background:var(--accent-color, var(--green2)); border-radius:2px;
}

.job-list { display:flex; flex-direction:column; gap:8px; }
.job-item {
  display:flex; align-items:center; gap:10px;
  font-size:13px; color:rgba(245,244,239,.8);
  padding:8px 12px;
  background:rgba(255,255,255,.03);
  border-radius:10px; border:1px solid rgba(255,255,255,.05);
  transition:background .2s;
}
.job-item:hover { background:rgba(255,255,255,.07); }
.job-dot {
  width:6px; height:6px; border-radius:50%; flex-shrink:0;
  background:var(--accent-color, var(--green2));
}

.skill-list { display:flex; flex-wrap:wrap; gap:8px; }
.skill-tag {
  font-size:12px; padding:5px 13px; border-radius:100px;
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
  color:rgba(245,244,239,.75);
  transition:all .2s;
}
.skill-tag:hover {
  background:rgba(92,173,106,0.18);
  border-color:var(--accent-color,var(--green2));
  color:var(--white);
}

/* Demand bar */
.demand-section { margin-bottom:28px; }
.demand-title {
  font-family:'Unbounded',sans-serif; font-size:10px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--dim); margin-bottom:14px;
  display:flex; align-items:center; gap:8px;
}
.demand-title::before {
  content:''; display:block; width:16px; height:2px;
  background:var(--accent-color,var(--green2)); border-radius:2px;
}
.demand-bars { display:flex; flex-direction:column; gap:10px; }
.demand-row { display:flex; align-items:center; gap:12px; }
.demand-name { font-size:12px; color:var(--dim); width:130px; flex-shrink:0; }
.demand-track {
  flex:1; height:7px; background:rgba(255,255,255,.08); border-radius:100px; overflow:hidden;
}
.demand-fill {
  height:100%;
  background:linear-gradient(90deg, var(--accent-color,var(--green2)), rgba(245,244,239,0.7));
  border-radius:100px;
  width:0; transition:width 1.2s cubic-bezier(.4,0,.2,1);
}
.demand-pct { font-size:11px; color:var(--white); font-family:'Unbounded',sans-serif; width:32px; text-align:right; }

/* Carousel dots */
.spec-dots {
  position:absolute; bottom:18px; right:36px;
  display:flex; gap:6px;
}
.sdot {
  width:6px; height:6px; border-radius:50%;
  background:rgba(255,255,255,.15); cursor:none;
  transition:all .2s;
}
.sdot.active { background:var(--gold2); width:20px; border-radius:100px; }

/* Auto-advance bar */
.auto-bar {
  position:absolute; bottom:0; left:0;
  height:2px; background:linear-gradient(90deg,var(--green2),var(--gold2));
  border-radius:2px;
  animation: autoAdv 12s linear infinite;
  transform-origin:left;
}
@keyframes autoAdv { from{width:0} to{width:100%} }

/* Responsive */
@media(max-width:900px){
  .shell{ grid-template-columns:1fr; grid-template-rows:auto auto 1fr; }
  .sidebar{ grid-row:2; display:flex; overflow-x:auto; border-right:none; border-bottom:1px solid var(--border); padding:10px 12px; }
  .spec-tab{ flex-direction:column; align-items:center; text-align:center; padding:10px 14px; border-left:none; border-bottom:3px solid transparent; min-width:90px; }
  .spec-tab.active{ border-left:none; border-bottom-color:var(--tab-color,var(--green2)); }
  .tab-info{ display:none; }
  .two-col{ grid-template-columns:1fr; }
  .stats-row{ grid-template-columns:1fr 1fr; }
  .panel-salary{ display:none; }
  .spec-panel{ padding:24px 20px; }
}
</style>
</head>

    ],
    jobs:['Диспетчер перевезень','Логіст','Механік автосервісу','Організатор транспорту','Водій категорії C/D (+ диплом)'],
    skills:['Логістичні системи (1С)','Технічна діагностика','Транспортне право','GPS-моніторинг','Організація вантажопотоків','Управління автопарком'],
    demand:[
      { name:'Логістичні компанії', pct:92 },
      { name:'Агрохолдинги', pct:82 },
      { name:'Держструктури', pct:70 },
      { name:'Міжнар. перевезення', pct:78 },
    ],
  },
];

// ── RENDER ──
const sidebar = document.querySelector('.sidebar');
const main    = document.querySelector('.main');
const dotsEl  = document.getElementById('specDots');
let currentIdx = 0;
let autoTimer;

specs.forEach((s, i) => {
  // Tab
  const tab = document.createElement('div');
  tab.className = 'spec-tab' + (i===0?' active':'');
  tab.style.setProperty('--tab-color', s.color);
  tab.innerHTML = `
    <div class="tab-icon">${s.emoji}</div>
    <div class="tab-info">
      <div class="tab-code">${s.code}</div>
      <div class="tab-name">${s.name}</div>
    </div>`;
  tab.onclick = () => activateSpec(i);
  sidebar.appendChild(tab);

  // Panel
  const panel = document.createElement('div');
  panel.className = 'spec-panel' + (i===0?' active':'');
  panel.id = 'panel-'+s.id;
  panel.style.setProperty('--accent-color', s.color);
  panel.innerHTML = `
    <div class="panel-head">
      <div class="panel-head-left">
        <span class="panel-emoji">${s.emoji}</span>
        <div class="panel-code">${s.code} · Новоушицький фаховий коледж</div>
        <div class="panel-title">${s.name}</div>
      </div>
      <div class="panel-salary">
        <div class="salary-label">Середня зарплата</div>
        <div class="salary-num">${s.salary}</div>
        <div class="salary-sub">грн / місяць</div>
      </div>
    </div>

    <p class="panel-desc">${s.desc}</p>

    <div class="stats-row">
      ${s.stats.map(st=>`
        <div class="stat-card">
          <div class="stat-val">${st.val}</div>
          <div class="stat-label">${st.label}</div>
        </div>`).join('')}
    </div>

    <div class="demand-section">
      <div class="demand-title">Попит на ринку праці</div>
      <div class="demand-bars">
        ${s.demand.map(d=>`
          <div class="demand-row">
            <div class="demand-name">${d.name}</div>
            <div class="demand-track"><div class="demand-fill" data-pct="${d.pct}"></div></div>
            <div class="demand-pct">${d.pct}%</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="two-col">
      <div class="info-block">
        <div class="info-block-title">Де працюватимеш</div>
        <div class="job-list">
          ${s.jobs.map(j=>`<div class="job-item"><span class="job-dot"></span>${j}</div>`).join('')}
        </div>
      </div>
      <div class="info-block">
        <div class="info-block-title">Ключові навички</div>
        <div class="skill-list">
          ${s.skills.map(sk=>`<span class="skill-tag">${sk}</span>`).join('')}
        </div>
      </div>
    </div>
  `;
  document.getElementById('panelContainer').appendChild(panel);

  // Dot
  const dot = document.createElement('div');
  dot.className = 'sdot' + (i===0?' active':'');
  dot.onclick = () => activateSpec(i);
  dotsEl.appendChild(dot);
});

function activateSpec(idx) {
  currentIdx = idx;
  document.querySelectorAll('.spec-tab').forEach((t,i) => t.classList.toggle('active', i===idx));
  document.querySelectorAll('.spec-panel').forEach((p,i) => p.classList.toggle('active', i===idx));
  document.querySelectorAll('.sdot').forEach((d,i) => d.classList.toggle('active', i===idx));

  // Animate bars
  setTimeout(() => {
    document.querySelectorAll('#panel-'+specs[idx].id+' .demand-fill').forEach(el => {
      el.style.width = el.dataset.pct + '%';
    });
  }, 80);

  // Restart auto-advance
  restartAuto();
}

function restartAuto() {
  const bar = document.getElementById('autoBar');
  bar.style.animation = 'none';
  void bar.offsetWidth;
  bar.style.animation = 'autoAdv 12s linear infinite';
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => {
    activateSpec((currentIdx + 1) % specs.length);
  }, 12000);
}

// Init bars for first panel
setTimeout(() => {
  document.querySelectorAll('#panel-agro .demand-fill').forEach(el => {
    el.style.width = el.dataset.pct + '%';
  });
}, 200);

restartAuto();
</script>
</body>
</html>
